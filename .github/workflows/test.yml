name: Java Maven CI Pipeline

on:
  push:
    branches: [ "test_branch" ]
  pull_request:
    branches: [ "test_branch" ]

jobs:
  build:
    name: Setting up of Environment & Build 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Maven Build
        run: |
          mvn -B clean verify

  test:
    name: Starting Application & Running Health Checks 
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Start application
        run: |
          echo "Starting Spring Boot application..."
          nohup java -jar target/demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          APP_PID=$!
          echo $APP_PID > app.pid

      - name: Wait for application & health-check with timeout
        run: |
          echo "Checking /health endpoint..."
          for i in {1..50}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Application is healthy!"
              break
            fi
            echo "Retry ($i/50)..."
            sleep 1
          done

      - name: Wait for /greet endpoint with timeout
        run: |
          echo "Checking /greet endpoint..."
          for i in {1..50}; do
            RESPONSE=$(curl -s http://localhost:8080/greet?name=Sachin || true)
            if [ ! -z "$RESPONSE" ]; then
              echo "Response: $RESPONSE"
              break
            fi
            echo "Retry ($i/50)..."
            sleep 1
          done

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

  publish_artifacts:
    name: Publishing Artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Retrieve build folder
        uses: actions/download-artifact@v4
        with:
          name: raw-target-folder
          path: target/

      - name: Upload raw build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: target/
          retention-days: 7